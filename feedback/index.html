<body><main class="shell narrow"><div class="brand"><img src="../assets/logo.svg" alt=""><b>Burner Email</b></div><h1>Help improve Burner Email.</h1><p class="lede">Tell us what did not work or what you would change.</p><form id="feedback-form" data-feedback-form="feedback"><label class="field-label" for="feedback-details">What should be better?</label><textarea id="feedback-details" name="details" maxlength="4000" required placeholder="What happened, and what did you expect?"></textarea><p class="small">Do not include passwords, verification codes, or private messages.</p><button class="submit" type="submit">Send feedback</button><p class="form-status" id="feedback-status" role="status" hidden></p></form><p class="small-note">Feedback is optional. We do not ask for your email address.</p><footer class="footer"><a href="https://alxrum.github.io/burner-email-pages/privacy/">Privacy policy</a></footer></main></body></html>
